<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Stylesheet -->
    <link rel="stylesheet" href="styles/style.css">

    <!-- JavaScript -->
    <script src="scripts/contact-form.js" defer></script>

    <!-- Favicon -->
    <link rel="icon" href="images/contact-form-favicon.png">

    <title>Contact Form</title>
</head>

<body>
    <div id="main">
        <header id="header">
            <h1>Contact Form</h1>
        </header>
        <form id="contact-form" action="#" method="get">
            <!-- First Name -->
            <div id="fname">
                <label for="first-name">First Name</label>
                <input type="text" class="text-field" id="first-name" name="first-name">
            </div>

            <!-- Last Name -->
            <div id="lname">
                <label for="last-name">Last Name</label>
                <input type="text" class="text-field" id="last-name" name="last-name">
            </div>

            <!-- Job Title -->
            <div id="job">
                <label for="job-title">Job Title</label>
                <input type="text" class="text-field" id="job-title" name="job-title">
            </div>

            <!-- Contact's Company -->
            <div id="com">
                <label for="company">Company</label>
                <input type="text" class="text-field" id="company" name="company">
            </div>

            <!-- LinkedIn URL -->
            <div id="url">
                <label for="linkedin-url">LinkedIn URL</label>
                <input type="url" class="text-field" id="linkedin-url" name="linkedin-url">
            </div>

            <!-- Email Address -->
            <div id="email-address">
                <label for="email">Email Address</label>
                <input type="email" class="text-field" id="email" name="email">
            </div>

            <!-- First Meeting -->
            <div id="how-we-met">
                <label for="first-meeting">How did we meet?</label>
                <select class="text-field" id="first-meeting" name="first-meeting">
                    <option value="none">-- Please select one --</option>
                    <option value="in-person">Met in Person</option>
                    <option value="event">Networking Event</option>
                    <option value="mutual">Mutual Contact Referral</option>
                    <option value="social">Social Media</option>
                    <option value="linkedin">LinkedIn</option>
                    <option value="portfolio">Your Portfolio or Website</option>
                    <option value="community">Online Forums or Community Outreach</option>
                    <option value="other">Other</option>
                </select>
            </div>

            <!-- Visible if "Other" is selected -->
            <div id="other-text">
                <label for="other">Other (please specify)</label>
                <input type="text" class="text-field" id="other" name="other">
            </div>

            <!-- Additional Messages -->
            <div id="messages">
                <label for="comments">Message</label>
                <textarea id="comments" name="comments"></textarea>
            </div>

            <!-- Add contact to mailing list-->
            <div id="mlist">
                <label for="mail-list">
                    <input type="checkbox" id="mail-list" name="mail-list" value="mail-list">
                    Please add me to your mailing list
                </label>
            </div>

            <!-- Choose Email Format for Mailing List -->
            <div id="eformat">
                <label id="email-format">Choose an email format:</label>
                <label for="html">
                    <input type="radio" id="html" name="email-format" value="html">
                    HTML
                </label>
                <label for="text">
                    <input type="radio" id="text" name="email-format" value="text">
                    Text
                </label>
            </div>

            <!-- Submit Button -->
            <button type="submit" id="submit-button">Submit</button>
        </form>
    </div>
</body>

</html>
